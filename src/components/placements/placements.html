<!-- =======================================================================
     KR ARTS AND SCIENCE COLLEGE - PLACEMENTS
     Section Background: --bg (#E8EFF9)
     Design: Simple, human, handcrafted typography with 3 running rows
     Palette: Mist Blue (Zero pure white)
     ======================================================================= -->

<section class="placements-section" id="placements" aria-label="Placement Achievements and Placed Students">
  
  <!-- 1. HEADER (Inside 1240px container, aligned to bottom, 64px below it) -->
  <div class="placements-container">
    <header class="placements-header">
      <!-- LEFT: small label + heading -->
      <div class="placements-header-title">
        <span class="placements-label">Placements</span>
        <h2 class="placements-heading">100% Placement<br>Achievement</h2>
      </div>

      <!-- RIGHT: two plain numbers side by side, 1px line divider -->
      <!-- Published figures: 18 students placed, 70 offer letters -->
      <!-- TODO: confirm 70 vs 72 with the college -->
      <div class="placements-stats" aria-label="Placement Statistics">
        <div class="placements-stat-box">
          <span class="placements-stat-number" id="placementsPlacedNum" aria-label="18 Students placed">18</span>
          <span class="placements-stat-label">Students placed</span>
        </div>

        <div class="placements-stat-divider" aria-hidden="true"></div>

        <div class="placements-stat-box">
          <span class="placements-stat-number" id="placementsOffersNum" aria-label="70 Offer letters">70</span>
          <span class="placements-stat-label">Offer letters</span>
        </div>
      </div>
    </header>
  </div>

  <!-- 2. RUNNING ROWS (Full Viewport Width, Edge-to-Edge with Soft Edge Fade) -->
  <div class="placements-marquee-viewport" id="placementsMarqueeArea" aria-label="Placed students running rows">
    <!-- Row 1: Leftward (Students 1 to 6) -->
    <div class="marquee-row-wrapper" data-row="1" data-direction="left">
      <div class="marquee-track" id="marqueeTrack1">
        <!-- Injected dynamically from placements.json -->
      </div>
    </div>

    <!-- Row 2: Rightward (Students 7 to 12) -->
    <div class="marquee-row-wrapper" data-row="2" data-direction="right">
      <div class="marquee-track" id="marqueeTrack2">
        <!-- Injected dynamically from placements.json -->
      </div>
    </div>

    <!-- Row 3: Leftward (Students 13 to 18) -->
    <div class="marquee-row-wrapper" data-row="3" data-direction="left">
      <div class="marquee-track" id="marqueeTrack3">
        <!-- Injected dynamically from placements.json -->
      </div>
    </div>
  </div>

  <!-- 2b. STATIC GRID (prefers-reduced-motion fallback) -->
  <div class="placements-container">
    <ul class="placements-static-grid" id="placementsStaticGrid" aria-label="List of placed students">
      <!-- Injected dynamically from src/data/placements.json -->
    </ul>

    <!-- Accessibility Pause / Play Button under the rows -->
    <div class="marquee-controls">
      <button type="button" class="marquee-toggle-btn" id="marqueeToggleBtn" aria-pressed="false">Pause</button>
    </div>

    <!-- 3. RECRUITERS (64px below rows, separated by 1px line) -->
    <div class="placements-recruiters">
      <div class="placements-recruiters-divider" aria-hidden="true"></div>
      
      <span class="placements-label recruiters-label">Our recruiters</span>
      
      <div class="placements-recruiters-list" id="placementsRecruitersList">
        <span class="recruiter-name">Besant Technologies</span>
        <span class="recruiter-sep" aria-hidden="true"></span>
        <span class="recruiter-name">Best Money Gold</span>
        <span class="recruiter-sep" aria-hidden="true"></span>
        <span class="recruiter-name">Maruti Suzuki</span>
        <span class="recruiter-sep" aria-hidden="true"></span>
        <span class="recruiter-name">Bhima Jewellers</span>
        <span class="recruiter-sep" aria-hidden="true"></span>
        <span class="recruiter-name">Pothys</span>
        <span class="recruiter-sep" aria-hidden="true"></span>
        <span class="recruiter-name">Theni Anantham</span>
        <span class="recruiter-sep" aria-hidden="true"></span>
        <span class="recruiter-name">BDreamz Global Solution</span>
      </div>
    </div>

    <!-- 4. LINK (48px below recruiters) -->
    <div class="placements-action">
      <a href="/apply.html" class="placements-apply-link">
        <span class="link-text">Apply for admission</span>
        <span class="link-underline" aria-hidden="true"></span>
      </a>
    </div>

  </div>
</section>
