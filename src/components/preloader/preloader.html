<!-- =========================================================================
     KR Arts And Science College - Signature Preloader ("SEAL ASSEMBLE")
     ========================================================================= -->
<div id="preloader" class="kr-preloader" role="status" aria-label="Loading KR Arts And Science College">
  <!-- Mobile Curtain Panels (for split exit) -->
  <div class="kr-curtain kr-curtain-top" aria-hidden="true"></div>
  <div class="kr-curtain kr-curtain-bottom" aria-hidden="true"></div>

  <!-- Initial 6px Gold Center Dot -->
  <div class="kr-gold-dot" id="krGoldDot" aria-hidden="true"></div>

  <!-- Centered Composition Stage -->
  <div class="kr-preloader-stage" id="krPreloaderStage">
    <!-- Assembling College Seal -->
    <div class="kr-seal-wrap" id="krSealWrap">
      <!-- Inline Vector SVG for Rings, Stars, Circular Text -->
      <svg class="kr-seal-svg" id="krSealSvg" viewBox="0 0 500 500" aria-hidden="true">
        <defs>
          <!-- Circular path for top arc text (from 9 o'clock over the top to 3 o'clock, radius 170) -->
          <path id="krSealTextArc" d="M 80, 250 A 170, 170 0 0, 1 420, 250" fill="none" />
        </defs>

        <!-- Outer Ring Base (draws clockwise) -->
        <circle class="kr-ring kr-ring-outer" cx="250" cy="250" r="238" />

        <!-- Outer Ring Progress (fills clockwise with real loading %) -->
        <circle class="kr-ring kr-ring-progress" cx="250" cy="250" r="238" />

        <!-- Middle Ring (draws counter-clockwise) -->
        <circle class="kr-ring kr-ring-middle" cx="250" cy="250" r="211" />

        <!-- Inner Ring (draws clockwise around painting) -->
        <circle class="kr-ring kr-ring-inner" cx="250" cy="250" r="130" />

        <!-- Ring Text: "KR ARTS AND SCIENCE COLLEGE" -->
        <g class="kr-seal-text-group" id="krSealTextGroup">
          <text class="kr-seal-text">
            <textPath href="#krSealTextArc" startOffset="50%" text-anchor="middle">
              <tspan class="kr-seal-char">K</tspan>
              <tspan class="kr-seal-char">R</tspan>
              <tspan class="kr-seal-char">&#160;</tspan>
              <tspan class="kr-seal-char">A</tspan>
              <tspan class="kr-seal-char">R</tspan>
              <tspan class="kr-seal-char">T</tspan>
              <tspan class="kr-seal-char">S</tspan>
              <tspan class="kr-seal-char">&#160;</tspan>
              <tspan class="kr-seal-char">A</tspan>
              <tspan class="kr-seal-char">N</tspan>
              <tspan class="kr-seal-char">D</tspan>
              <tspan class="kr-seal-char">&#160;</tspan>
              <tspan class="kr-seal-char">S</tspan>
              <tspan class="kr-seal-char">C</tspan>
              <tspan class="kr-seal-char">I</tspan>
              <tspan class="kr-seal-char">E</tspan>
              <tspan class="kr-seal-char">N</tspan>
              <tspan class="kr-seal-char">C</tspan>
              <tspan class="kr-seal-char">E</tspan>
              <tspan class="kr-seal-char">&#160;</tspan>
              <tspan class="kr-seal-char">C</tspan>
              <tspan class="kr-seal-char">O</tspan>
              <tspan class="kr-seal-char">L</tspan>
              <tspan class="kr-seal-char">L</tspan>
              <tspan class="kr-seal-char">E</tspan>
              <tspan class="kr-seal-char">G</tspan>
              <tspan class="kr-seal-char">E</tspan>
            </textPath>
          </text>
        </g>

        <!-- Left Star at 9 o'clock (center: 80, 250) -->
        <g class="kr-star-group kr-star-left" id="krStarLeft">
          <g class="kr-star-anchor" transform="translate(80, 250)">
            <g class="kr-star-flyer" id="krStarLeftFlyer">
              <polygon class="kr-star-poly" points="0,-14 3.23,-4.45 13.31,-4.33 5.23,1.70 8.23,11.33 0,5.5 -8.23,11.33 -5.23,1.70 -13.31,-4.33 -3.23,-4.45" />
            </g>
            <!-- 8 Bursting Spark Lines -->
            <g class="kr-spark-group" id="krSparkLeft">
              <line class="kr-spark-line" x1="0" y1="-12" x2="0" y2="-22" transform="rotate(0)" />
              <line class="kr-spark-line" x1="0" y1="-12" x2="0" y2="-22" transform="rotate(45)" />
              <line class="kr-spark-line" x1="0" y1="-12" x2="0" y2="-22" transform="rotate(90)" />
              <line class="kr-spark-line" x1="0" y1="-12" x2="0" y2="-22" transform="rotate(135)" />
              <line class="kr-spark-line" x1="0" y1="-12" x2="0" y2="-22" transform="rotate(180)" />
              <line class="kr-spark-line" x1="0" y1="-12" x2="0" y2="-22" transform="rotate(225)" />
              <line class="kr-spark-line" x1="0" y1="-12" x2="0" y2="-22" transform="rotate(270)" />
              <line class="kr-spark-line" x1="0" y1="-12" x2="0" y2="-22" transform="rotate(315)" />
            </g>
          </g>
        </g>

        <!-- Right Star at 3 o'clock (center: 420, 250) -->
        <g class="kr-star-group kr-star-right" id="krStarRight">
          <g class="kr-star-anchor" transform="translate(420, 250)">
            <g class="kr-star-flyer" id="krStarRightFlyer">
              <polygon class="kr-star-poly" points="0,-14 3.23,-4.45 13.31,-4.33 5.23,1.70 8.23,11.33 0,5.5 -8.23,11.33 -5.23,1.70 -13.31,-4.33 -3.23,-4.45" />
            </g>
            <!-- 8 Bursting Spark Lines -->
            <g class="kr-spark-group" id="krSparkRight">
              <line class="kr-spark-line" x1="0" y1="-12" x2="0" y2="-22" transform="rotate(0)" />
              <line class="kr-spark-line" x1="0" y1="-12" x2="0" y2="-22" transform="rotate(45)" />
              <line class="kr-spark-line" x1="0" y1="-12" x2="0" y2="-22" transform="rotate(90)" />
              <line class="kr-spark-line" x1="0" y1="-12" x2="0" y2="-22" transform="rotate(135)" />
              <line class="kr-spark-line" x1="0" y1="-12" x2="0" y2="-22" transform="rotate(180)" />
              <line class="kr-spark-line" x1="0" y1="-12" x2="0" y2="-22" transform="rotate(225)" />
              <line class="kr-spark-line" x1="0" y1="-12" x2="0" y2="-22" transform="rotate(270)" />
              <line class="kr-spark-line" x1="0" y1="-12" x2="0" y2="-22" transform="rotate(315)" />
            </g>
          </g>
        </g>
      </svg>

      <!-- Center Painting Container (Saraswati Artwork + Shutter Blades + Shine) -->
      <div class="kr-painting-wrap" id="krPaintingWrap">
        <img src="/assets/logo-painting.webp" alt="KR College Emblem Painting" class="kr-painting-img" id="krPaintingImg" width="250" height="250" />
        <!-- Brightness Overlay (opacity 0.6 -> 0, brightness 0.4 -> 1.0) -->
        <div class="kr-painting-overlay" id="krPaintingOverlay" aria-hidden="true"></div>
        <!-- Diagonal Light Band Shine Beam -->
        <div class="kr-painting-shine" id="krPaintingShine" aria-hidden="true"></div>
        <!-- Iris Shutter Blades Container -->
        <div class="kr-shutter-container" id="krShutterContainer" aria-hidden="true"></div>
      </div>
    </div>

    <!-- Tamil Motto below Seal (32px gap) -->
    <div class="kr-motto-wrap" id="krMottoWrap">
      <div class="kr-motto" id="krMotto" lang="ta">உள்ளுவதெல்லாம் உயர்வுள்ளல்</div>
    </div>
  </div>

  <!-- Bottom-Center Bar (24px + safe-area inset) -->
  <div class="kr-bottom-bar" id="krBottomBar">
    <div class="kr-counter" id="krCounter" aria-hidden="true">
      <span class="kr-counter-val" id="krCounterVal">000</span>
    </div>
    <button type="button" class="kr-skip-btn" id="krSkipBtn" aria-label="Skip introduction animation">Skip</button>
  </div>

  <!-- Visually Hidden Screen Reader Status -->
  <div class="kr-sr-status sr-only" id="krSrStatus" aria-live="polite">Loading KR Arts And Science College, 0 percent</div>
</div>
